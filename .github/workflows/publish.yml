name: Publish to npm (manual)

# Manual fallback for (re)publishing a specific tag to npm.
# The automatic publish on release happens in release.yml; use this only to
# recover from a failed publish or to republish an existing release tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. allnewsapi-mcp-v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
