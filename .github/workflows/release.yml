name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  # Publish runs in the same workflow, gated on a release actually being created.
  # This avoids relying on a tag-push event to trigger a separate workflow, which
  # is fragile: release-please tags are component-prefixed (e.g. allnewsapi-mcp-v1.1.0)
  # and tag pushes made by CI tokens do not reliably trigger downstream workflows.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC auth to the MCP Registry
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      # Fails the build if server.json (name/version) has drifted from
      # package.json (mcpName/version), so a stale MCP Registry manifest is
      # never published alongside a new npm release.
      - name: Verify MCP manifest is in sync
        run: npm run verify:mcp

      - run: npm run build
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A freshly published npm version can take a few seconds to propagate
      # to registry.npmjs.org's CDN. The MCP Registry validates the package
      # version against npm at publish time, so poll until npm actually
      # serves it before handing off to mcp-publisher — otherwise publish
      # intermittently 404s on a version that exists but hasn't propagated.
      - name: Wait for npm version to propagate
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          for i in $(seq 1 10); do
            if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -qx "${PKG_VERSION}"; then
              echo "npm registry has ${PKG_NAME}@${PKG_VERSION}"
              exit 0
            fi
            echo "Waiting for ${PKG_NAME}@${PKG_VERSION} to appear on npm (attempt ${i}/10)..."
            sleep 6
          done
          echo "::error::${PKG_NAME}@${PKG_VERSION} did not appear on npm after waiting."
          exit 1

      # Publish the same release to the official MCP Registry so listings
      # (and everything that ingests from it) stay in sync with npm.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
